<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Kestrels Admin</title>
  <style>
    :root { --ink:#17191b; --lime:#a9bf00; --paper:#f4f4f2; --muted:#687078; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 Arial,sans-serif; }
    header { background:var(--ink); color:#fff; padding:20px; border-bottom:4px solid var(--lime); }
    header strong { display:block; font-size:24px; }
    header span { color:var(--lime); font-weight:bold; font-size:12px; letter-spacing:1.5px; }
    main { width:min(1100px,calc(100% - 28px)); margin:28px auto; display:grid; gap:24px; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); }
    section { background:#fff; border-radius:16px; padding:24px; box-shadow:0 8px 28px rgba(0,0,0,.07); }
    h1,h2 { margin:0 0 8px; }
    p { color:var(--muted); }
    label { display:block; margin:14px 0 5px; font-weight:bold; }
    input,select { width:100%; padding:12px; border:1px solid #c9ced2; border-radius:8px; font-size:16px; }
    button,.button { border:0; border-radius:8px; padding:11px 14px; cursor:pointer; font-weight:bold; text-decoration:none; text-align:center; }
    .primary { width:100%; margin-top:20px; background:var(--ink); color:#fff; font-size:16px; }
    .secondary { background:#e9ecdf; color:var(--ink); }
    .toolbar { display:flex; gap:8px; margin:16px 0; }
    .toolbar input { flex:1; }
    .customer { border:1px solid #e0e3e5; border-radius:10px; padding:14px; margin:10px 0; }
    .customer h3 { margin:0 0 4px; }
    .customer p { margin:3px 0 12px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    #result,#status { display:none; margin-top:18px; padding:14px; border-radius:8px; background:#f1f3e5; word-break:break-word; }
    #status.error { background:#fff0f0; color:#8a1c1c; }
    .empty { text-align:center; padding:26px; color:var(--muted); }
    @media(max-width:780px){ main{grid-template-columns:1fr;} section{padding:20px;} }
  </style>
</head>
<body>
  <header><strong>My Kestrels Admin</strong><span>KESTRELS MOTOR COMPANY</span></header>
  <main>
    <section>
      <h1 id="formTitle">Add customer</h1>
      <p>Create or update an individual customer app link.</p>
      <form id="customerForm">
        <input id="customerId" type="hidden">
        <label for="name">Customer name</label><input id="name" required autocomplete="name">
        <label for="registration">Registration</label><input id="registration" required placeholder="AB12 CDE" autocapitalize="characters">
        <label for="make">Make / model</label><input id="make" required>
        <label for="mileage">Mileage</label><input id="mileage" inputmode="numeric" placeholder="31,500">
        <label for="motDue">MOT due</label><input id="motDue" type="date">
        <label for="serviceDue">Service due</label><input id="serviceDue" placeholder="January 2027">
        <label for="warranty">Warranty</label>
        <select id="warranty"><option>Active</option><option>Expired</option><option>Not supplied</option></select>
        <button class="primary" type="submit" id="saveButton">Create customer link</button>
        <button class="secondary" type="button" id="cancelEdit" hidden>Cancel edit</button>
      </form>
      <div id="status"></div>
      <div id="result"><strong>Customer link:</strong><p><a id="customerLink" target="_blank" rel="noopener"></a></p><button class="secondary" id="copyButton">Copy link</button></div>
    </section>
    <section>
      <h2>Customers</h2>
      <p>Search, open or update an existing customer.</p>
      <div class="toolbar"><input id="search" type="search" placeholder="Search name or registration"><button class="secondary" id="refreshButton">Refresh</button></div>
      <div id="customers"><div class="empty">Loading customers…</div></div>
    </section>
  </main>
  <script>
    const form = document.getElementById("customerForm");
    const registrationBox = document.getElementById("registration");
    const statusBox = document.getElementById("status");
    let customers = [];

    function showStatus(message, error = false) {
      statusBox.textContent = message;
      statusBox.className = error ? "error" : "";
      statusBox.style.display = "block";
    }

    function customerUrl(id) {
      return window.location.origin + "/?customer=" + encodeURIComponent(id);
    }

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Something went wrong");
      return data;
    }

    registrationBox.addEventListener("blur", async () => {
      const registration = registrationBox.value.replace(/\s/g, "").toUpperCase();
      if (!registration) return;
      registrationBox.value = registration;
      try {
        const result = await api("/api/mot/" + encodeURIComponent(registration));
        const vehicle = Array.isArray(result) ? result[0] : result;
        document.getElementById("make").value = [vehicle.make, vehicle.model].filter(Boolean).join(" ");
        const latestTest = vehicle.motTests && vehicle.motTests[0];
        if (latestTest && latestTest.expiryDate) document.getElementById("motDue").value = latestTest.expiryDate.substring(0,10);
      } catch (error) {
        showStatus("Vehicle lookup failed. You can enter the details manually.", true);
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const id = document.getElementById("customerId").value;
      const payload = {
        name: document.getElementById("name").value,
        registration: registrationBox.value,
        make: document.getElementById("make").value,
        mileage: document.getElementById("mileage").value,
        motDue: document.getElementById("motDue").value,
        serviceDue: document.getElementById("serviceDue").value,
        warranty: document.getElementById("warranty").value
      };
      try {
        const saved = await api(id ? "/api/customers/" + encodeURIComponent(id) : "/api/customers", {
          method: id ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const link = customerUrl(saved.id);
        const linkElement = document.getElementById("customerLink");
        linkElement.textContent = link;
        linkElement.href = link;
        document.getElementById("result").style.display = "block";
        showStatus(id ? "Customer updated." : "Customer created.");
        resetForm();
        await loadCustomers();
      } catch (error) { showStatus(error.message, true); }
    });

    function resetForm() {
      form.reset();
      document.getElementById("customerId").value = "";
      document.getElementById("formTitle").textContent = "Add customer";
      document.getElementById("saveButton").textContent = "Create customer link";
      document.getElementById("cancelEdit").hidden = true;
    }

    function editCustomer(id) {
      const customer = customers.find(item => item.id === id);
      if (!customer) return;
      document.getElementById("customerId").value = customer.id;
      document.getElementById("name").value = customer.name || "";
      registrationBox.value = customer.registration || "";
      document.getElementById("make").value = customer.make || "";
      document.getElementById("mileage").value = customer.mileage || "";
      document.getElementById("motDue").value = (customer.mot_due || "").substring(0,10);
      document.getElementById("serviceDue").value = customer.service_due || "";
      document.getElementById("warranty").value = customer.warranty || "Not supplied";
      document.getElementById("formTitle").textContent = "Edit customer";
      document.getElementById("saveButton").textContent = "Save changes";
      document.getElementById("cancelEdit").hidden = false;
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    async function loadCustomers() {
      const container = document.getElementById("customers");
      try {
        customers = await api("/api/customers");
        renderCustomers();
      } catch (error) { container.innerHTML = '<div class="empty">Unable to load customers.</div>'; }
    }

    function renderCustomers() {
      const term = document.getElementById("search").value.toLowerCase();
      const filtered = customers.filter(c => `${c.name} ${c.registration} ${c.make}`.toLowerCase().includes(term));
      const container = document.getElementById("customers");
      if (!filtered.length) { container.innerHTML = '<div class="empty">No matching customers.</div>'; return; }
      container.innerHTML = filtered.map(c => `
        <article class="customer">
          <h3>${escapeHtml(c.name || "Unnamed customer")}</h3>
          <p><strong>${escapeHtml(c.registration)}</strong> · ${escapeHtml(c.make)}</p>
          <div class="actions">
            <a class="button secondary" href="${customerUrl(c.id)}" target="_blank" rel="noopener">Open app</a>
            <button class="secondary" data-copy="${c.id}">Copy link</button>
            <button class="secondary" data-edit="${c.id}">Edit</button>
          </div>
        </article>`).join("");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    }

    document.getElementById("customers").addEventListener("click", event => {
      const editId = event.target.dataset.edit;
      const copyId = event.target.dataset.copy;
      if (editId) editCustomer(editId);
      if (copyId) navigator.clipboard.writeText(customerUrl(copyId)).then(() => showStatus("Customer link copied."));
    });
    document.getElementById("search").addEventListener("input", renderCustomers);
    document.getElementById("refreshButton").addEventListener("click", loadCustomers);
    document.getElementById("cancelEdit").addEventListener("click", resetForm);
    document.getElementById("copyButton").addEventListener("click", () => navigator.clipboard.writeText(document.getElementById("customerLink").href).then(() => showStatus("Customer link copied.")));
    loadCustomers();
  </script>
</body>
</html>
